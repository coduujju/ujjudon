<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GOATUJJU — Life OS</title>
<meta name="goatujju-backend" content="" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" referrerpolicy="no-referrer" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" referrerpolicy="no-referrer"></script>
<style>
:root{
  --bg:#080c0a; --card:#0f1512; --card2:#151d18; --line:#243129; --line2:#35463c;
  --text:#f0f1e9; --muted:#a1ada5; --faint:#87978d; --accent:#34d399; --accent-dim:#187953;
  --danger:#ef4444; --radius:12px;
  --mono:'JetBrains Mono',monospace; --head:'Space Grotesk',sans-serif; --body:'Manrope',sans-serif; --editorial:'Cormorant Garamond',Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;}
body{overflow-x:hidden}
::selection{background:var(--accent);color:#000}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:10px}
::-webkit-scrollbar-track{background:transparent}

/* layout */
.app{display:flex;min-height:100vh}
.sidebar{width:248px;flex-shrink:0;background:#070807;border-right:1px solid var(--line);position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;z-index:60;transition:transform .32s cubic-bezier(.22,.61,.36,1)}
.brand{padding:26px 22px 18px;border-bottom:1px solid var(--line)}
.brand h1{font-family:var(--head);font-size:21px;font-weight:700;letter-spacing:.5px}
.brand h1 span{color:var(--accent)}
.brand p{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:4px;letter-spacing:1px;text-transform:uppercase}
.nav{flex:1;overflow-y:auto;padding:12px 10px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:8px;color:var(--muted);font-size:13.5px;font-weight:500;transition:background-color .2s,color .2s;margin-bottom:2px}
.nav a i{width:16px;text-align:center;font-size:14px;transition:color .2s}
.nav a:hover{background:var(--card);color:var(--text)}
.nav a.active{background:var(--card2);color:var(--text)}
.nav a.active i{color:var(--accent)}
.nav a.active{box-shadow:inset 2px 0 0 var(--accent)}
.sidebar-foot{padding:14px 18px;border-top:1px solid var(--line);font-family:var(--mono);font-size:10px;color:var(--faint)}
.main{flex:1;margin-left:248px;min-width:0}
.topbar{display:none;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(0,0,0,.82);backdrop-filter:blur(14px);z-index:40}
.topbar h1{font-family:var(--head);font-size:17px}.topbar h1 span{color:var(--accent)}
.hamb{background:var(--card);border:1px solid var(--line);color:var(--text);width:40px;height:40px;border-radius:9px;font-size:16px;display:flex;align-items:center;justify-content:center}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:55;backdrop-filter:blur(2px)}
.content{padding:36px 48px 90px;max-width:1420px;margin:0 auto}
.content>*{animation:fade .45s ease both}
.content>*:nth-child(2){animation-delay:.05s}
.content>*:nth-child(3){animation-delay:.1s}
.content>*:nth-child(4){animation-delay:.15s}
.page{display:none;animation:fade .4s ease}
.page.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* typography helpers */
.page-head{margin-bottom:32px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.page-head h2{font-family:var(--head);font-size:34px;font-weight:500;letter-spacing:-1.2px}
.page-head p{color:var(--muted);font-size:13.5px;margin-top:6px}
.sec-title{font-family:var(--head);font-size:16px;font-weight:600;margin:30px 0 14px;display:flex;align-items:center;gap:9px}
.sec-title i{color:var(--accent);font-size:14px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;transition:border-color .25s,transform .25s}
.card:hover{border-color:var(--line2)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}

.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;transition:border-color .25s,transform .25s}
.stat:hover{border-color:var(--line2);transform:translateY(-2px)}
.stat .label{font-family:var(--mono);font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint);display:flex;align-items:center;gap:7px}
.stat .label i{color:var(--accent);font-size:12px}
.stat .val{font-family:var(--mono);font-size:30px;font-weight:600;margin-top:10px;line-height:1}
.stat .val small{font-size:14px;color:var(--muted);font-weight:400}
.stat .sub{font-size:11.5px;color:var(--muted);margin-top:7px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border:1px solid var(--line2);border-radius:40px;font-size:12px;font-family:var(--mono);color:var(--text);background:var(--card);transition:border-color .2s,background-color .2s}
.pill i{color:var(--accent);font-size:11px}
.pill:hover{border-color:var(--accent-dim)}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;border:1px solid var(--line2);background:var(--card2);color:var(--text);transition:background-color .2s,border-color .2s,transform .12s}
.btn:hover{border-color:var(--accent-dim)}
.btn:active{transform:scale(.97)}
.btn-accent{background:var(--accent);color:#04120d;border-color:var(--accent)}
.btn-accent:hover{background:#0ea371}
.btn-sm{padding:6px 11px;font-size:12px}
.btn-ghost{background:transparent}

/* inputs */
input[type=number],input[type=text],input[type=date],input[type=month],input[type=url],select,textarea{
  background:#07090800;background:#070908;border:1px solid var(--line2);border-radius:8px;color:var(--text);
  padding:9px 11px;font-size:13.5px;width:100%;transition:border-color .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
textarea{resize:vertical;min-height:70px;line-height:1.5}
.field-label{font-family:var(--mono);font-size:10px;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);margin-bottom:6px;display:block}

/* progress */
.bar{height:7px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:10px}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent-dim),var(--accent));border-radius:6px;transition:width .9s cubic-bezier(.22,.61,.36,1)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--card2);border:1px solid var(--line2);border-radius:30px;padding:5px 7px 5px 12px;font-family:var(--mono);font-size:11.5px}
.chip b{color:var(--accent)}
.chip .x{width:19px;height:19px;border-radius:50%;background:var(--line);border:none;color:var(--muted);font-size:10px;display:flex;align-items:center;justify-content:center;transition:background-color .2s,color .2s}
.chip .x:hover{background:var(--danger);color:#fff}

/* hero */
.hero{position:relative;isolation:isolate;overflow:hidden;min-height:446px;border:1px solid var(--line2);border-radius:16px;background:#101a13;padding:42px}
.hero-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:63% center;z-index:-2}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(5,13,8,.94) 0%,rgba(5,13,8,.84) 30%,rgba(5,13,8,.34) 66%,rgba(5,13,8,.12) 100%),linear-gradient(0deg,rgba(5,13,8,.58),transparent 45%);pointer-events:none}
.hero .kicker,.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:1.7px;text-transform:uppercase;color:var(--accent);line-height:1.7}
.hero .kicker{display:inline-block;background:rgba(5,18,10,.8);border:1px solid rgba(123,179,143,.22);border-radius:4px;padding:6px 10px;color:#8fe7b6;max-width:100%}
.hero h1{font-family:var(--head);font-size:clamp(36px,3.3vw,51px);font-weight:500;letter-spacing:-1.8px;margin:26px 0 16px;line-height:1.08;max-width:560px}
.hero h1 em{font-family:var(--editorial);font-weight:500;font-size:1.25em;color:#e4f3d9;letter-spacing:-1px}
.hero .tag{color:#c0ccc3;font-size:13px;max-width:375px;line-height:1.8}
.hero-actions{display:flex;align-items:center;gap:18px;margin-top:26px;flex-wrap:wrap}
.hero-actions .btn{padding:12px 18px;border-radius:7px}
.text-link{font-size:12px;color:var(--text);display:inline-flex;gap:12px;align-items:center;border-bottom:1px solid var(--line2);padding:8px 0;transition:color .2s,border-color .2s}
.text-link:hover{color:var(--accent);border-color:var(--accent)}
.hero-caption{position:absolute;right:24px;bottom:24px;text-align:right;font-family:var(--mono);font-size:9px;letter-spacing:.8px;color:#f0f6f1;line-height:1.8;background:rgba(8,17,11,.6);padding:10px 14px;border:1px solid rgba(255,255,255,.2);border-radius:6px;backdrop-filter:blur(12px)}
.hero-caption strong{display:block;font-size:12px;letter-spacing:2px}
.home-masthead{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:25px}
.home-masthead h2{font-family:var(--head);font-size:14px;letter-spacing:2px;font-weight:500;text-transform:uppercase}
.home-masthead p{font-size:11px;color:var(--muted);margin-top:7px}
.edition{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--muted);text-align:right;flex-shrink:0}
.edition i{color:var(--accent);font-size:6px;margin-right:8px}
.mission-strip{display:flex;flex-wrap:wrap;gap:12px 28px;padding:21px 0;border-bottom:1px solid var(--line);margin-bottom:32px}
.mission-strip span{font-family:var(--mono);font-size:10px;color:var(--muted);display:flex;gap:8px;align-items:center}
.mission-strip i{color:var(--accent);font-size:10px}
.editorial-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:34px 0 18px}
.editorial-heading h2{font-size:18px;font-weight:500;letter-spacing:-.4px;margin-top:5px;font-family:var(--head)}
.editorial-heading p{font-size:12px;color:var(--muted);line-height:1.7;margin-top:8px}
.campus-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.campus-card{min-width:0}
.campus-open{width:100%;display:block;position:relative;padding:0;border:1px solid var(--line2);background:var(--card);overflow:hidden;border-radius:9px;color:var(--text);text-align:left}
.campus-open img{display:block;width:100%;height:200px;object-fit:cover;transition:transform .65s cubic-bezier(.2,.65,.3,1),filter .4s;filter:saturate(.85)}
.campus-open:hover img{transform:scale(1.045);filter:saturate(1)}
.photo-expand{position:absolute;right:12px;top:12px;border:1px solid rgba(255,255,255,.35);background:rgba(7,14,10,.65);backdrop-filter:blur(8px);width:30px;height:30px;display:grid;place-items:center;border-radius:50%;font-size:11px}
.campus-caption{padding:16px 0 4px}
.campus-caption .meta{display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:9px;letter-spacing:.7px;color:var(--faint);text-transform:uppercase}
.campus-caption h3{font-family:var(--editorial);font-size:29px;font-weight:500;letter-spacing:-.4px;margin:5px 0}
.campus-caption p{font-size:12px;color:var(--muted);line-height:1.65}
.campus-caption a{display:inline-block;font-family:var(--mono);font-size:9px;margin-top:9px;color:var(--faint);text-decoration:underline;text-underline-offset:3px}
.home-quote{margin-top:34px;padding:28px 0 10px;border-top:1px solid var(--line);display:flex;gap:25px;align-items:flex-start}
.home-quote>i{color:var(--accent);font-size:19px;margin-top:8px}
.home-quote #homeQuote{font-family:var(--editorial);font-size:27px;line-height:1.2}
.home-quote .eyebrow{font-size:8px;margin-top:10px;color:var(--faint)}
.vision-intro{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin:4px 0 35px}
.vision-intro h1{font-family:var(--editorial);font-size:clamp(42px,5vw,60px);font-weight:500;line-height:1.05;letter-spacing:-1px;margin-top:12px}
.vision-intro h1 em{color:#a6c9ad}
.vision-intro p{font-size:13px;line-height:1.8;color:var(--muted);max-width:320px}
.vision-gallery{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:32px 26px}
.vision-gallery .campus-open img{height:300px}
.vision-gallery .campus-card:nth-child(even){padding-top:55px}
.vision-gallery .campus-card:nth-child(3) .campus-open img{height:350px}
.vision-gallery .campus-card:nth-child(4) .campus-open img{object-position:center 55%}
.photo-banner{display:flex;position:relative;isolation:isolate;overflow:hidden;min-height:175px;border:1px solid var(--line);border-radius:12px;padding:30px;margin:24px 0 30px;align-items:center;background:var(--card)}
.photo-banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 40%;z-index:-2}
.photo-banner:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,13,8,.94),rgba(5,13,8,.6) 55%,rgba(5,13,8,.15));z-index:-1}
.photo-banner h3{font-family:var(--editorial);font-size:35px;font-weight:500;max-width:450px;line-height:1.1;margin:10px 0}
.photo-banner p{color:#c5d1c8;font-size:11px;line-height:1.7}
.photo-dialog{padding:0;border:1px solid var(--line2);border-radius:14px;background:#0c120f;color:var(--text);width:min(1080px,calc(100vw - 32px));max-height:90vh;margin:auto;box-shadow:0 30px 100px #000}
.photo-dialog::backdrop{background:rgba(0,5,2,.9);backdrop-filter:blur(14px)}
.photo-dialog-top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line)}
.photo-dialog-top span{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--muted)}
.photo-dialog-image{width:100%;height:min(56vh,560px);object-fit:contain;display:block;background:#050906}
.photo-dialog-bottom{padding:20px 24px;display:flex;align-items:flex-start;justify-content:space-between;gap:20px}
.photo-dialog-bottom h3{font-family:var(--editorial);font-size:29px;font-weight:500}
.photo-dialog-bottom p,.photo-dialog-bottom a{font-size:11px;color:var(--muted);line-height:1.8}
.photo-dialog-bottom a{text-decoration:underline;text-underline-offset:3px}
.photo-dialog-controls{display:flex;gap:8px;flex-shrink:0}
.photo-dialog-controls .btn{width:40px;height:40px;justify-content:center;padding:0}
.photo-error{padding:25px;text-align:center;color:var(--muted);font-size:13px}
.photo-error[hidden]{display:none}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.sidebar{background:#0b110d}
.brand{padding:28px 24px 22px}
.brand h1{letter-spacing:1px}
.brand p{font-size:9px;color:var(--muted);letter-spacing:1.5px;margin-top:8px}
.nav{padding:15px 12px}
.nav a{border-radius:6px;font-size:12px;padding:9px 13px;letter-spacing:.1px}
.nav a.active{background:#17261d;color:#d6f0df}
.sidebar-foot{background:#0b110d}
.stat,.goal,.place{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.sec-title{letter-spacing:-.2px}
.vision-card{text-align:left;padding:22px;display:flex;align-items:center;gap:14px}
.vision-card i{font-size:18px;margin:0}
.vision-card b{font-size:12px;font-weight:500}
@media(max-width:1100px){.hero-caption{font-size:8px}.hero{padding:32px}.hero .tag{max-width:320px}.campus-open img{height:180px}}
@media(max-width:860px){
  .home-masthead{margin-bottom:22px}.hero{min-height:450px;padding:30px 24px}
  .hero-caption{bottom:20px;right:20px}.hero-actions{margin-bottom:45px}
  .vision-intro{display:block}.vision-intro p{margin-top:20px;max-width:100%}
  .vision-gallery{gap:26px 18px}.vision-gallery .campus-open img{height:230px}
}
@media(max-width:520px){
  .edition{display:none}.hero{min-height:500px;padding:28px 24px}
  .hero-photo{object-position:35% center}.hero::after{background:linear-gradient(0deg,rgba(5,13,8,.98),rgba(5,13,8,.7) 65%,rgba(5,13,8,.35))}
  .hero h1{font-size:39px;margin-top:36px}.hero .tag{font-size:12px}.hero-caption{font-size:8px;padding:7px 10px;text-align:left;left:24px;right:auto;bottom:20px}
  .hero-caption strong{font-size:10px}.hero-actions{gap:14px}.hero-actions .btn{font-size:12px}
  .mission-strip{gap:14px 20px;padding:22px 0}.mission-strip span{font-size:9px}
  .campus-row,.vision-gallery{grid-template-columns:minmax(0,1fr);gap:26px}
  .campus-open img,.vision-gallery .campus-open img,.vision-gallery .campus-card:nth-child(3) .campus-open img{height:240px}
  .vision-gallery .campus-card:nth-child(even){padding-top:0}
  .editorial-heading{align-items:flex-start;gap:15px}.editorial-heading .text-link{font-size:10px;flex-shrink:0}
  .photo-banner{padding:24px;min-height:190px}.photo-banner h3{font-size:30px}
  .photo-dialog-top{padding:12px 16px}.photo-dialog-image{height:38vh}.photo-dialog-bottom{padding:16px;flex-wrap:wrap}
  .photo-dialog-bottom>div:first-child{min-width:0;flex:1}.photo-dialog-bottom h3{font-size:25px}
  .home-quote{gap:16px}.home-quote #homeQuote{font-size:25px}
  .vision-card{padding:16px;gap:10px}.vision-card i{font-size:16px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

/* countdown */
.cd{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;position:relative;overflow:hidden;transition:border-color .25s,transform .25s}
.cd:hover{border-color:var(--accent-dim);transform:translateY(-2px)}
.cd .cd-label{font-family:var(--mono);font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--faint)}
.cd .cd-num{font-family:var(--mono);font-size:34px;font-weight:700;color:var(--accent);line-height:1;margin:10px 0 4px}
.cd .cd-sub{font-size:11px;color:var(--muted)}

/* goat ring */
.ring-wrap{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:180px;height:180px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring .ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .ring-center b{font-family:var(--mono);font-size:44px;font-weight:700;line-height:1}
.ring .ring-center span{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);margin-top:4px}
.verdict{font-family:var(--head);font-size:22px;font-weight:600}
.breakdown{display:flex;flex-direction:column;gap:11px;margin-top:4px;min-width:260px;flex:1}
.brk-row{display:flex;align-items:center;gap:12px}
.brk-row .bn{font-family:var(--mono);font-size:11.5px;width:118px;color:var(--muted);flex-shrink:0}
.brk-row .bb{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.brk-row .bb>span{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .8s}
.brk-row .bv{font-family:var(--mono);font-size:11.5px;width:58px;text-align:right;color:var(--text)}

/* log cards */
.log-card{background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:15px}
.log-card .lc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.log-card .lc-top span{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.log-card .lc-top i{color:var(--accent)}
.log-card input{font-family:var(--mono);font-size:18px;padding:8px 10px}

/* goal card */
.goal{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;transition:border-color .25s,transform .25s}
.goal:hover{border-color:var(--line2);transform:translateY(-2px)}
.goal .gt{font-family:var(--mono);font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between;align-items:center}
.goal .gt .inv{color:var(--accent);font-size:9px;border:1px solid var(--accent-dim);padding:2px 6px;border-radius:20px}
.goal .gbig{font-family:var(--mono);font-size:38px;font-weight:700;margin:12px 0 2px;line-height:1}
.goal .gtar{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.goal .gin{margin-top:14px}

/* dsa roadmap */
.dsa-list{display:flex;flex-direction:column;gap:7px}
.dsa-item{display:flex;align-items:center;gap:13px;padding:11px 14px;background:var(--card);border:1px solid var(--line);border-radius:9px;transition:border-color .2s,background-color .2s;cursor:pointer}
.dsa-item:hover{border-color:var(--line2)}
.dsa-item .dc{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;transition:background-color .2s,border-color .2s}
.dsa-item.done .dc{background:var(--accent);border-color:var(--accent);color:#04120d}
.dsa-item.done .dn{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.dsa-item .dn{font-size:13.5px;flex:1}
.dsa-item .dnum{font-family:var(--mono);font-size:11px;color:var(--faint)}
.dsa-item.current{border-color:var(--accent);background:linear-gradient(90deg,rgba(16,185,129,.08),transparent)}
.dsa-item.current .dn{font-weight:600}
.tag-now{font-family:var(--mono);font-size:9px;background:var(--accent);color:#04120d;padding:2px 7px;border-radius:20px;letter-spacing:.5px}

/* gym tiles */
.gym-week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.gym-day{aspect-ratio:1;border:1px solid var(--line2);border-radius:10px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:background-color .2s,border-color .2s,transform .12s}
.gym-day:hover{border-color:var(--accent-dim)}
.gym-day:active{transform:scale(.95)}
.gym-day span{font-family:var(--mono);font-size:11px;color:var(--muted)}
.gym-day i{font-size:16px;color:var(--faint);transition:color .2s}
.gym-day.on{background:linear-gradient(160deg,var(--accent-dim),rgba(16,185,129,.15));border-color:var(--accent)}
.gym-day.on i{color:var(--accent)}
.gym-day.on span{color:var(--text)}

/* cardio */
.cardio-btns{display:flex;gap:9px;flex-wrap:wrap}
.cardio-btns .cb{flex:1;min-width:90px;padding:14px;border:1px solid var(--line2);border-radius:10px;background:var(--card2);text-align:center;transition:background-color .2s,border-color .2s}
.cardio-btns .cb:hover{border-color:var(--accent-dim)}
.cardio-btns .cb.on{background:linear-gradient(160deg,var(--accent-dim),rgba(16,185,129,.12));border-color:var(--accent)}
.cardio-btns .cb b{font-family:var(--mono);font-size:15px;display:block}
.cardio-btns .cb small{font-size:10.5px;color:var(--muted)}

/* habits */
.habit-row{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.habit-row:last-child{border-bottom:none}
.habit-info{width:150px;flex-shrink:0}
.habit-info b{font-size:14px;display:block}
.habit-info .streak{font-family:var(--mono);font-size:11px;color:var(--accent);margin-top:3px}
.dot-grid{display:grid;grid-template-columns:repeat(15,1fr);gap:5px;flex:1}
.dot{aspect-ratio:1;border-radius:3px;background:var(--line);transition:background-color .2s}
.dot.f1{background:var(--accent)}
.dot.today{box-shadow:0 0 0 1.5px var(--text)}

/* calendar */
.cal-month{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px;transition:border-color .25s}
.cal-month:hover{border-color:var(--line2)}
.cal-month .cm-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.cal-month .cm-h b{font-family:var(--head);font-size:15px}
.cal-month .cm-h .phase{font-family:var(--mono);font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent-dim);padding:2px 7px;border-radius:20px}
.cal-item{display:flex;align-items:flex-start;gap:9px;padding:6px 0;font-size:12.5px;color:var(--muted);cursor:pointer}
.cal-item .cc{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--line2);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:9px;transition:background-color .2s}
.cal-item.done .cc{background:var(--accent);border-color:var(--accent);color:#04120d}
.cal-item.done span{text-decoration:line-through;color:var(--faint)}

/* timetable */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tab{padding:9px 15px;border:1px solid var(--line2);border-radius:30px;background:var(--card);font-size:12.5px;color:var(--muted);transition:background-color .2s,color .2s,border-color .2s}
.tab:hover{color:var(--text)}
.tab.active{background:var(--accent);color:#04120d;border-color:var(--accent);font-weight:600}
.tt-row{display:flex;gap:12px;align-items:center;margin-bottom:9px}
.tt-row input:first-child{max-width:150px}
.tt-row .del{flex-shrink:0}

/* placements */
.place{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:19px;transition:border-color .25s,transform .25s}
.place:hover{border-color:var(--line2);transform:translateY(-2px)}
.place h4{font-family:var(--head);font-size:16px;display:flex;align-items:center;gap:9px}
.place h4 .dot-stat{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.place .meta{font-size:11.5px;color:var(--muted);margin-top:9px;line-height:1.55}
.place .meta b{color:var(--text);font-weight:500}
.ready-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.ready-grid .rg-cell .field-label{margin-bottom:4px}
.ready-grid select{padding:7px 9px;font-size:12px}

/* timeline */
.timeline{position:relative;padding-left:30px}
.timeline::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--line2)}
.tl-item{position:relative;padding:0 0 26px 0}
.tl-item::before{content:"";position:absolute;left:-26px;top:3px;width:13px;height:13px;border-radius:50%;background:var(--card);border:2px solid var(--accent)}
.tl-item .tl-date{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.5px}
.tl-item h4{font-family:var(--head);font-size:15px;margin:5px 0 4px}
.tl-item p{font-size:12.5px;color:var(--muted);line-height:1.55}

/* vision */
.vision-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;text-align:left;display:flex;align-items:center;gap:14px;transition:border-color .25s,transform .25s,background-color .25s}
.vision-card:hover{border-color:var(--accent);transform:translateY(-4px);background:var(--card2)}
.vision-card i{font-size:18px;color:var(--accent);margin:0}
.vision-card b{font-family:var(--head);font-size:12px;font-weight:500;display:block;line-height:1.4}

/* quotes */
.quote-row{padding:14px 0;border-bottom:1px solid var(--line);font-family:var(--head);font-size:15px;color:var(--text);display:flex;gap:12px;align-items:flex-start}
.quote-row:last-child{border-bottom:none}
.quote-row i{color:var(--accent);font-size:14px;margin-top:4px}

/* journal entries */
.jentry{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:17px;margin-bottom:12px}
.jentry .jh{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}
.jentry .jh .jd{font-family:var(--mono);font-size:12px;color:var(--accent)}
.jentry .jh .jm{font-size:22px}
.jentry .jbody p{font-size:12.5px;margin-bottom:7px;line-height:1.55}
.jentry .jbody b{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);display:block;margin-bottom:2px}
.mood-pick{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px}
.mood-pick button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--card2);font-size:22px;transition:border-color .2s,transform .12s}
.mood-pick button:hover{transform:scale(1.08)}
.mood-pick button.on{border-color:var(--accent);background:var(--card)}

/* modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-bg.open{display:flex;animation:fade .2s ease}
.modal{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:26px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto}
.modal h3{font-family:var(--head);font-size:19px;margin-bottom:18px}
.modal .mrow{margin-bottom:14px}
.modal .mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}

.chart-box{position:relative;height:300px;width:100%}
.empty{text-align:center;color:var(--faint);font-size:12.5px;padding:30px;font-family:var(--mono)}

/* AI coach */
.coach-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.coach-toolbar select{width:auto;max-width:280px;flex:1;min-width:120px}
.coach-model{font-family:var(--mono);font-size:10px;letter-spacing:.5px;color:var(--accent);border:1px solid var(--accent-dim);border-radius:30px;padding:7px 11px}
.coach-intro{padding:24px;border-left:2px solid var(--accent);background:var(--card);margin-bottom:20px}
.coach-intro h3{font-family:var(--head);font-size:20px;margin-bottom:8px}
.coach-intro p,.coach-privacy{font-size:12px;line-height:1.7;color:var(--muted)}
.coach-prompts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.coach-prompts .btn{text-align:left;font-size:12px}
.coach-context{padding:16px 18px;border:1px solid var(--line);border-radius:10px;margin-bottom:18px}
.coach-context label{display:flex;gap:10px;align-items:center;font-size:13px;cursor:pointer}
.coach-context input{accent-color:var(--accent);width:16px;height:16px}
.coach-context details{margin-top:10px;font-size:12px;color:var(--muted)}
.coach-context summary{cursor:pointer}
.coach-context pre{font-family:var(--mono);font-size:11px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:220px;overflow-y:auto;margin-top:12px}
.coach-messages{display:flex;flex-direction:column;gap:18px;max-height:500px;overflow-y:auto;padding:4px 4px 20px;scroll-behavior:smooth}
.coach-message{width:92%;padding:18px 20px;border:1px solid var(--line);background:var(--card);border-radius:12px;min-width:0}
.coach-message.user{align-self:flex-end;width:auto;max-width:85%;background:var(--card2)}
.coach-message .who{font-family:var(--mono);font-size:10px;letter-spacing:1px;color:var(--accent);margin-bottom:10px}
.coach-message.user .who{color:var(--muted)}
.coach-message .text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.8}
.coach-compose{margin-top:10px;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:14px}
.coach-compose textarea{min-height:95px;background:transparent;border:0;padding:4px;resize:vertical}
.coach-compose-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.coach-status{font-family:var(--mono);font-size:10px;color:var(--muted);overflow-wrap:anywhere}
.coach-error{padding:13px 16px;border:1px solid var(--danger);border-radius:8px;color:#fca5a5;font-size:12px;line-height:1.6;margin:12px 0}
button:disabled{opacity:.45;cursor:not-allowed}
.coach-privacy{margin-top:12px}
@media(max-width:520px){
  .coach-toolbar select{max-width:100%;flex-basis:100%}
  .coach-intro{padding:20px 16px}
  .coach-message{width:100%;padding:14px}
  .coach-message.user{max-width:92%}
  .coach-messages{max-height:min(46vh,360px)}
  .coach-model{margin-right:auto}
  .coach-compose-foot{align-items:flex-end}
}

/* Study, money and semester workspaces */
.hub-toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:0 0 24px}
.hub-toolbar input,.hub-toolbar select{width:auto;max-width:100%}
.hub-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hub-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 24px;border-bottom:1px solid var(--line);padding-bottom:14px}
.hub-tabs .btn.active{background:#183b2b;color:#c8f6dc;border-color:var(--accent-dim)}
.hub-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:28px}
.hub-stat{padding:22px;background:var(--card);border:1px solid var(--line);border-radius:12px;min-width:0}
.hub-stat .label{font-size:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.hub-stat .value{font:500 clamp(21px,2.2vw,30px)/1.3 var(--head);letter-spacing:-.8px;margin:10px 0 6px;overflow-wrap:anywhere}
.hub-stat .hint{font-size:11px;color:var(--muted);line-height:1.6}
.hub-split{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:24px;align-items:start}
.hub-section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;min-width:0;margin-bottom:24px}
.hub-section h3{font:500 18px var(--head);margin-bottom:8px}
.hub-note{font-size:12px;color:var(--muted);line-height:1.8;overflow-wrap:anywhere}
.hub-note a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.hub-empty{padding:34px 12px;text-align:center;color:var(--muted);font-size:13px;line-height:1.8;border:1px dashed var(--line2);border-radius:8px}
.hub-empty i{display:block;font-size:22px;color:var(--accent);margin-bottom:12px}
.hub-progress{height:5px;background:var(--line);border-radius:4px;overflow:hidden;margin:16px 0 10px}
.hub-progress>span{display:block;height:100%;background:var(--accent);transition:width .3s}
.hub-form{display:grid;gap:16px}.hub-form label{font-size:11px;color:var(--muted);display:block;line-height:1.6;min-width:0}
.hub-form input,.hub-form select{margin-top:5px;width:100%;min-width:0}
.hub-form .field-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.hub-form [type=checkbox]{width:16px;height:16px;accent-color:var(--accent);margin:0 8px 0 0}
.hub-form .check-label{display:flex;align-items:flex-start;gap:4px}
.hub-form .check-label input{flex-shrink:0;margin-top:3px}
.hub-error{color:#fca5a5;font-size:12px;line-height:1.7;white-space:pre-wrap}
.hub-form .mfoot{margin-top:0}.modal.wide{max-width:760px}
.hub-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.hub-row:last-child{border-bottom:0}.hub-row>div{min-width:0}
.hub-row .row-name{font-size:13px;font-weight:500;overflow-wrap:anywhere}
.hub-row .row-meta{font-size:10px;font-family:var(--mono);color:var(--muted);line-height:1.8;margin-top:6px;overflow-wrap:anywhere}
.hub-row .row-number{font:500 14px var(--mono);white-space:nowrap}
.hub-row .row-buttons{display:flex;gap:5px}
.hub-row .row-buttons .btn{padding:7px 10px}
.hub-positive{color:var(--accent)}.hub-negative{color:#fca5a5}.hub-warning{color:#facc75}
.hub-goal{padding:20px 0;border-bottom:1px solid var(--line)}.hub-goal:last-child{border:0}
.hub-goal-title{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;font-size:14px;overflow-wrap:anywhere}
.hub-goal .hub-actions{flex-shrink:0}.hub-goal .btn{padding:6px 9px}
.syllabus-group{border:1px solid var(--line);border-radius:10px;margin:14px 0;background:var(--card)}
.syllabus-group summary{padding:18px 20px;font-family:var(--head);font-size:14px;cursor:pointer;line-height:1.7}
.syllabus-group .topic-row{padding:15px 20px;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) 155px auto;align-items:center;gap:18px}
.topic-row label{display:flex;gap:10px;font-size:12px;line-height:1.6;align-items:flex-start;overflow-wrap:anywhere}
.topic-row input[type=checkbox]{flex-shrink:0;accent-color:var(--accent);margin-top:4px;width:15px;height:15px}
.topic-row .revision-label{display:block;font-family:var(--mono);font-size:9px;color:var(--muted);margin-bottom:4px}
.topic-row input[type=date]{font-size:11px;padding:7px;min-width:0;width:100%}
.topic-row .topic-done{color:var(--muted);text-decoration:line-through}
.academic-card{border:1px solid var(--line);border-radius:12px;padding:23px;margin-bottom:18px;background:var(--card)}
.academic-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}
.academic-top h3{font:500 17px var(--head);overflow-wrap:anywhere}
.academic-top>div{min-width:0}.academic-top .hub-actions{flex-shrink:0}
.attendance-body{display:grid;grid-template-columns:125px minmax(0,1fr) auto;gap:25px;align-items:center}
.attendance-percent{font:500 30px var(--head);letter-spacing:-1px}
.attendance-body .hub-actions{max-width:260px;justify-content:flex-end}
.grade-row{display:grid;grid-template-columns:minmax(0,1fr) 100px 120px auto;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.grade-row:last-child{border:0}.grade-row>div{min-width:0}.grade-row .course-name{font-size:14px;overflow-wrap:anywhere}
.grade-row select{width:100%;padding:9px}
.formula{font-family:var(--mono);font-size:13px;line-height:1.8;color:var(--accent);padding:16px;background:#091b12;border-radius:8px;margin:12px 0}
.grade-bands{display:flex;flex-wrap:wrap;gap:10px;margin:15px 0}.grade-bands span{font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:5px;padding:8px}
.assessment-row{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:10px;min-width:0;padding:12px 0;border-bottom:1px solid var(--line)}
.mark-result{padding:16px;border:1px solid var(--accent-dim);border-radius:8px;font-size:13px;line-height:1.8;background:#0a1d13}
@media(max-width:1100px){.hub-split{grid-template-columns:minmax(0,1fr)}.attendance-body{grid-template-columns:100px minmax(0,1fr)}.attendance-body>.hub-actions{grid-column:1/-1;max-width:none;justify-content:flex-start}}
@media(max-width:700px){
 .hub-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.hub-stat{padding:16px}.hub-section{padding:18px}
 .hub-row{gap:10px;grid-template-columns:minmax(0,1fr) auto}.hub-row .row-buttons{grid-column:1/-1;justify-content:flex-end}
 .hub-row .row-number{font-size:12px}.academic-top{flex-wrap:wrap}.academic-card{padding:18px}
 .grade-row{grid-template-columns:minmax(0,1fr) 90px;gap:10px}.grade-row .grade-credits{grid-column:1}.grade-row .grade-select{grid-column:2;grid-row:1/3}.grade-row .btn{grid-column:1/-1;justify-content:center}
 .syllabus-group .topic-row{grid-template-columns:minmax(0,1fr) auto;gap:14px}.topic-row>label{grid-column:1/-1}.topic-row .revision-field{max-width:165px}
 .assessment-row{grid-template-columns:repeat(3,minmax(0,1fr))}.assessment-row>label:first-child{grid-column:1/-1}
 .hub-form .field-row{gap:10px}.attendance-body{gap:15px}.hub-toolbar .hub-actions{width:100%}
}

/* backup buttons */
.backup-btns{display:flex;gap:8px;margin-top:11px}
.backup-btns .btn{flex:1;justify-content:center;font-size:11px;padding:7px 8px}
/* countdown edit */
.cd-label{position:relative}
.cd-edit{position:absolute;top:-3px;right:0;width:22px;height:22px;border:1px solid var(--line2);background:var(--card2);color:var(--muted);border-radius:6px;font-size:9px;display:flex;align-items:center;justify-content:center;transition:border-color .2s,color .2s}
.cd-edit:hover{border-color:var(--accent);color:var(--accent)}
/* daily nudge */

    targets:lsGet('targets',DEF_TARGETS),

/* one-time archive migration for the Oct 12 version */
function migrate(){
  const V='oct12-v1';
  const cur=lsRaw('version');
  if(cur===null){lsSet('version',V);return;}
  if(JSON.parse(cur)!==V){
    const arch={};['daily','weightLog','cfLog','cgpaLog','deficitLog','gymWeek','mocks','habits','journal','goatHistory'].forEach(k=>{const r=lsRaw(k);if(r!=null)arch[k]=JSON.parse(r);});
    const old=lsGet('archive',[]);old.push({at:new Date().toISOString(),version:JSON.parse(cur),data:arch});lsSet('archive',old);
    ['daily','weightLog','cfLog','cgpaLog','deficitLog','gymWeek','mocks','habits','journal','goatHistory'].forEach(k=>{try{localStorage.removeItem(NS+k);}catch(e){}});
    lsSet('version',V);
  }
}
function ensureGymWeek(){
  const mon=dateKey(getMonday(new Date()));
  if(S.gymWeek.weekStart!==mon){S.gymWeek={weekStart:mon,days:[false,false,false,false,false,false,false]};save('gymWeek');}
}

/* ---------------- helpers ---------------- */
function latestWeight(){if(S.weightLog.length){const s=[...S.weightLog].sort((a,b)=>a.date<b.date?-1:1);return s[s.length-1].kg;}return S.targets.weight.current;}
function todayDaily(){const k=dateKey();if(!S.daily[k])S.daily[k]={study:0,problems:0,deficit:0,cardio:0,sleep:0};return S.daily[k];}
function gymSessionsThisWeek(){return S.gymWeek.days.filter(Boolean).length;}
function cumDeficit(){return S.deficitLog.reduce((a,b)=>a+(+b.kcal||0),0);}
function weekSummary(){
  const mon=getMonday(new Date());let study=0,problems=0,deficit=0,cardio=0;
  for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);const e=S.daily[dateKey(d)];if(e){study+=+e.study||0;problems+=+e.problems||0;deficit+=+e.deficit||0;cardio+=+e.cardio||0;}}
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  return{study:Math.round(study*10)/10,problems,deficit,cardio,gym:gymSessionsThisWeek(),mon,sun};
}
function trackerDay(){const t=todayLocal();if(t<TRACK_START)return 0;const n=daysBetween(TRACK_START,t)+1;return Math.min(n,TRACK_DAYS);}

/* ---------------- GOAT score ---------------- */
function computeGoat(){
  const d=todayDaily();
  const gym=Math.min(gymSessionsThisWeek(),5)/5*20;
  let cardio=0;const c=+d.cardio||0;if(c>30)cardio=25;else if(c>=20)cardio=15;else if(c>=10)cardio=10;else cardio=0;
  const problems=Math.min((+d.problems||0)*2.5,20);
  const deficit=Math.min((+d.deficit||0)/100*2,20);
  const study=Math.min((+d.study||0)/8*10,10);
  const start=S.targets.weight.start||85.75,tgt=S.targets.weight.target||75;
  const wprog=Math.max(0,Math.min((start-latestWeight())/(start-tgt),1))*10;
  const sl=+d.sleep||0;let sleep=0;if(sl>=7)sleep=5;else if(sl>=6)sleep=3;else if(sl>=5)sleep=1;
  const raw=gym+cardio+problems+deficit+study+wprog+sleep;
  const score=Math.round(raw/110*1000)/10;
  return{score,raw:Math.round(raw*10)/10,parts:[
    {n:'Gym',v:gym,max:20},{n:'Cardio',v:cardio,max:25},{n:'Problems',v:problems,max:20},
    {n:'Cal Deficit',v:deficit,max:20},{n:'Study',v:study,max:10},{n:'Weight',v:wprog,max:10},{n:'Sleep',v:sleep,max:5}
  ]};
}
function verdict(s){if(s>=85)return'Ahead of schedule';if(s>=70)return'Solid day';if(s>=50)return'Decent, do better';return'Reset.';}

function animateNum(el,to,dec){
  if(!el)return;const from=0,dur=750,t0=performance.now();dec=dec||0;

}

function campusCard(id,place){
  const p=CAMPUS_PHOTOS.find(p=>p.id===id);
  return `<figure class="campus-card" data-testid="${place}-campus-${id}">
    <button class="campus-open" data-testid="${place}-photo-${id}" onclick="openPhoto('${id}')" aria-label="View ${p.name} photograph">
      <img src="${p.src}" alt="${p.alt}" loading="lazy" decoding="async" data-testid="${place}-image-${id}">
      <span class="photo-expand" aria-hidden="true"><i class="fa-solid fa-expand"></i></span>
    </button>
    <figcaption class="campus-caption"><div class="meta"><span>${p.name}</span><span>${p.location.split(',')[0]}</span></div><h3>${p.title}</h3><p>${p.description}</p><a href="${p.source}" target="_blank" rel="noopener noreferrer" data-testid="${place}-credit-${id}">Photo: ${p.credit}</a>${p.license?` <a href="${p.licenseUrl}" target="_blank" rel="noopener noreferrer" data-testid="${place}-license-${id}">${p.license}</a>`:''}</figcaption>
  </figure>`;
}
let photoIndex=0;
function openPhoto(id){
  photoIndex=CAMPUS_PHOTOS.findIndex(p=>p.id===id);paintPhoto();
  const dialog=document.getElementById('photoDialog');if(!dialog.open){dialog.showModal();document.body.style.overflow='hidden';}
}
function paintPhoto(){
  const p=CAMPUS_PHOTOS[photoIndex];
  document.getElementById('photoCounter').textContent=String(photoIndex+1).padStart(2,'0')+' / '+String(CAMPUS_PHOTOS.length).padStart(2,'0')+' — THE PLACES AHEAD';
  const img=document.getElementById('photoFull');img.alt=p.alt;img.src=p.src;
  document.getElementById('photoError').hidden=true;
  document.getElementById('photoTitle').textContent=p.name;
  document.getElementById('photoDescription').textContent=p.description;
  document.getElementById('photoCredit').textContent=p.credit;
  document.getElementById('photoSource').href=p.source;
  document.getElementById('photoLicenseWrap').hidden=!p.license;
  const license=document.getElementById('photoLicense');license.textContent=p.license||'';if(p.licenseUrl)license.href=p.licenseUrl;else license.removeAttribute('href');
}
function stepPhoto(direction){photoIndex=(photoIndex+direction+CAMPUS_PHOTOS.length)%CAMPUS_PHOTOS.length;paintPhoto();}
function closePhoto(){document.getElementById('photoDialog').close();}
const photoDialog=document.getElementById('photoDialog');
photoDialog.addEventListener('close',()=>{document.body.style.overflow='';});
photoDialog.addEventListener('click',e=>{if(e.target===photoDialog){const r=photoDialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closePhoto();}});
photoDialog.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();stepPhoto(e.key==='ArrowRight'?1:-1);}});
function campusBanner(id,title,subtitle){
  const p=CAMPUS_PHOTOS.find(p=>p.id===id);
  return `<aside class="photo-banner" data-testid="${current}-campus-banner"><img src="${p.src}" alt="${p.alt}" loading="lazy" decoding="async"><div><div class="eyebrow">${p.name} · ${p.location.split(',')[0]}</div><h3>${title}</h3><p>${subtitle}</p><button class="text-link" style="background:none;border:0;border-bottom:1px solid var(--line2)" onclick="openPhoto('${id}')" data-testid="${current}-banner-photo">View photograph & credits <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i></button></div></aside>`;
}

function logCard(key,label,icon,step){const d=todayDaily();return `<div class="log-card"><div class="lc-top"><span>${label}</span><i class="fa-solid ${icon}"></i></div><input type="number" step="${step}" min="0" value="${d[key]||''}" placeholder="0" data-log="${key}" data-testid="log-${key}"></div>`;}
function postDash(){
  document.querySelectorAll('[data-anim]').forEach(el=>animateNum(el,+el.dataset.anim,+el.dataset.dec));
  document.querySelectorAll('[data-log]').forEach(inp=>inp.addEventListener('input',()=>{
    const k=dateKey();if(!S.daily[k])S.daily[k]={study:0,problems:0,deficit:0,cardio:0,sleep:0};
    S.daily[k][inp.dataset.log]=+inp.value||0;save('daily');recordGoat();updateGoatUI();
    const nd=document.querySelector('.nudge');if(nd)nd.remove();
  }));
  updateGoatUI();
}
function updateGoatUI(){
  const g=computeGoat();
  const num=document.getElementById('goatNum');if(num)animateNum(num,g.score,1);
  const ring=document.getElementById('ringFill');if(ring)ring.style.strokeDashoffset=490-(490*g.score/100);
  const v=document.getElementById('goatVerdict');if(v)v.textContent=verdict(g.score);
  const raw=document.getElementById('goatRaw');if(raw)raw.textContent=`${g.raw} / 110 raw points`;
  const b=document.getElementById('goatBreak');if(b)b.innerHTML=g.parts.map(p=>
    `<div class="brk-row"><div class="bn">${p.n}</div><div class="bb"><span style="width:${p.v/p.max*100}%"></span></div><div class="bv">${(Math.round(p.v*10)/10)}/${p.max}</div></div>`).join('');
}

/* ========== GOALS ========== */
function rGoals(){
  const cards=Object.keys(DEF_TARGETS).map(k=>{
    const g=S.targets[k];const cur=k==='weight'?latestWeight():g.current;let prog;
    if(g.inverse){if(g.target>0&&cur>0){if(k==='weight'){const st=g.start||85.75;prog=(st-cur)/(st-g.target)*100;}else{prog=g.target/cur*100;}}else prog=0;}
    else prog=g.target>0?cur/g.target*100:0;
    prog=Math.max(0,Math.min(prog,100));
    return `<div class="goal"><div class="gt"><span>${g.label}</span>${g.inverse?'<span class="inv">lower = better</span>':''}</div>
      <div class="gbig"><span data-anim="${cur}" data-dec="${g.dec}">0</span></div>
      <div class="gtar">/ target ${g.target}</div>
      <div class="bar"><span style="width:0" data-bar="${prog}"></span></div>
      <div class="gin"><span class="field-label">update current</span><input type="number" step="any" value="${g.current}" data-goal="${k}" data-testid="goal-${k}"></div></div>`;
  }).join('');
  return `${head('Goals','8 targets · edit inline, saves instantly')}
  <div class="grid g4">${cards}</div>
  <div class="sec-title"><i class="fa-solid fa-code"></i>Codeforces — actual vs target</div>
  <div class="card"><div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn btn-sm btn-accent" data-testid="add-cf" onclick="modalCF()"><i class="fa-solid fa-plus"></i> Log CF</button></div><div class="chart-box"><canvas id="cfChartG"></canvas></div><div class="chips" id="cfChipsG"></div></div>
  <div class="sec-title"><i class="fa-solid fa-chart-column"></i>CGPA trend</div>
  <div class="card"><div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn btn-sm btn-accent" data-testid="add-cgpa" onclick="modalCGPA()"><i class="fa-solid fa-plus"></i> Log CGPA</button></div><div class="chart-box"><canvas id="cgpaChart"></canvas></div><div class="chips" id="cgpaChips"></div></div>`;
}
function postGoals(){
  document.querySelectorAll('[data-anim]').forEach(el=>animateNum(el,+el.dataset.anim,+el.dataset.dec));
  setTimeout(()=>document.querySelectorAll('[data-bar]').forEach(el=>el.style.width=el.dataset.bar+'%'),60);
  document.querySelectorAll('[data-goal]').forEach(inp=>inp.addEventListener('input',()=>{S.targets[inp.dataset.goal].current=+inp.value||0;save('targets');}));
  drawCF('cfChartG','cfChipsG');drawCGPA();
}
function drawCF(canvasId,chipsId){
  const log=[...S.cfLog].sort((a,b)=>a.date<b.date?-1:1);
  const labels=log.map(e=>e.date.slice(5));
  makeChart(canvasId,lineCfg(labels.length?labels:['start'],[
    {label:'Actual',data:log.map(e=>e.rating),borderColor:ACC,backgroundColor:'rgba(16,185,129,.12)',tension:.3,fill:true,pointRadius:4,pointBackgroundColor:ACC},
    {label:'Target 1500',data:(labels.length?labels:['start']).map(()=>1500),borderColor:'#8b938e',borderDash:[6,5],pointRadius:0,tension:0}
  ]));
  const chips=document.getElementById(chipsId);
  if(chips)chips.innerHTML=log.length?log.map((e,i)=>`<span class="chip">${e.date.slice(5)} · <b>${e.rating}</b><button class="x" onclick="delCF(${origCFIndex(e)})">\u00D7</button></span>`).join(''):'<div class="empty">No CF entries yet. Add one.</div>';
}
function origCFIndex(e){return S.cfLog.indexOf(e);}
function drawCGPA(){
  const log=[...S.cgpaLog].sort((a,b)=>a.date<b.date?-1:1);
  const labels=log.map(e=>e.date.slice(2));
  makeChart('cgpaChart',{type:'bar',data:{labels:labels.length?labels:['—'],datasets:[
    {label:'DTU',data:log.map(e=>e.dtu),backgroundColor:ACC,borderRadius:4},
    {label:'IIMB',data:log.map(e=>e.iimb),backgroundColor:'#334b42',borderRadius:4}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:10,usePointStyle:true}}},scales:{x:{grid:GRID},y:{grid:GRID,beginAtZero:false,suggestedMin:6,suggestedMax:10}}}});
  const chips=document.getElementById('cgpaChips');
  if(chips)chips.innerHTML=log.length?log.map(e=>`<span class="chip">${e.date} · DTU <b>${e.dtu}</b> IIMB <b>${e.iimb}</b><button class="x" onclick="delCGPA(${S.cgpaLog.indexOf(e)})">\u00D7</button></span>`).join(''):'<div class="empty">No CGPA entries yet.</div>';
}
window.modalCF=function(){openModal(`<h3>Log Codeforces rating</h3>
  <div class="mrow"><span class="field-label">Date</span><input type="date" id="mcfDate" value="${dateKey()}"></div>

/* ========== HABITS ========== */
function rHabits(){
  const tk=dateKey();
  const rows=HABITS.map(h=>{const data=S.habits[h]||{};const streak=habitStreak(h);const bg=streakBadge(streak);
    let grid='';for(let i=29;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=dateKey(d);const f=data[k]?'f1':'';grid+=`<div class="dot ${f} ${k===tk?'today':''}"></div>`;}
    return `<div class="habit-row ${bg?'lit':''}"><div class="habit-info"><b>${h}</b><div class="streak"><i class="fa-solid fa-fire"></i> ${streak} day streak</div>${bg?`<div class="milestone"><i class="fa-solid ${bg.ic}"></i> ${bg.t}</div>`:''}</div><div class="dot-grid">${grid}</div></div>`;}).join('');
  const checks=HABITS.map(h=>{const on=(S.habits[h]||{})[tk];return `<button class="btn ${on?'btn-accent':''}" data-habit="${h}" data-testid="habit-${h.replace(/\s/g,'')}" style="justify-content:center"><i class="fa-solid ${on?'fa-check':'fa-plus'}"></i> ${h}</button>`;}).join('');
  return `${head('Habits','30-day consistency · log today')}
  <div class="sec-title"><i class="fa-solid fa-check-double"></i>Log today</div>
  <div class="grid g3">${checks}</div>
  <div class="sec-title"><i class="fa-solid fa-table-cells"></i>Last 30 days</div>
  <div class="card">${rows}</div>`;
}
function habitStreak(h){const data=S.habits[h]||{};let s=0;const d=new Date();for(;;){const k=dateKey(d);if(data[k]){s++;d.setDate(d.getDate()-1);}else{if(k===dateKey())  {d.setDate(d.getDate()-1);continue;}break;}}return s;}
function streakBadge(s){if(s>=100)return{t:'LEGEND',ic:'fa-crown'};if(s>=50)return{t:'50 DAYS',ic:'fa-gem'};if(s>=30)return{t:'30 DAYS',ic:'fa-trophy'};if(s>=14)return{t:'14 DAYS',ic:'fa-medal'};if(s>=7)return{t:'7 DAYS',ic:'fa-fire-flame-curved'};return null;}
function postHabits(){document.querySelectorAll('[data-habit]').forEach(b=>b.addEventListener('click',()=>{const h=b.dataset.habit,k=dateKey();if(!S.habits[h])S.habits[h]={};if(S.habits[h][k])delete S.habits[h][k];else S.habits[h][k]=true;save('habits');render('habits');postHabits();}));}

  const pct=held?attended/held*100:null;

  if(attended*100<target*held){return{pct,below:true,count:target===100?null:Math.max(0,Math.ceil((target*held-100*attended)/(100-target))),status:'Below target'};}
  return{pct,below:false,count:Math.max(0,Math.floor((100*attended-target*held)/target)),status:'On track'};
}
function sgpaSummary(courses=semesterCourses()){
  let credits=0,covered=0,points=0,pending=0;
  courses.forEach(c=>{if(c.credits>0){credits+=c.credits;if(Object.hasOwn(DTU_POINTS,c.grade)){covered+=c.credits;points+=c.credits*DTU_POINTS[c.grade];}else pending++;}});
  return{credits,covered,points,pending,value:covered?points/covered:null};
}

function sgpaView(courses,s){
  return `<section class="hub-section"><h3>The credit-weighted mean</h3><div class="formula" data-testid="sgpa-formula">SGPA = Σ(credits × grade points) ÷ Σcredits</div><p class="hub-note" data-testid="sgpa-coverage">${s.pending?s.pending+' credit-bearing subject(s) still need a grade. The displayed average is partial, not a full-semester prediction.':s.covered?'All credit-bearing subjects have an estimate.':'Add subjects and choose grades to build a prediction.'} F contributes zero points but its credits remain in the denominator. Zero-credit courses are excluded. I / not estimated remains pending.</p><div class="grade-bands">${Object.entries(DTU_POINTS).map(([g,p])=>`<span>${g} = ${p}</span>`).join('')}</div>
    ${courses.length?courses.map(c=>`<div class="grade-row" data-testid="grade-row-${text(c.id)}"><div><div class="course-name">${text(c.name)}</div><p class="hub-note">${c.prediction?'Marks estimate: '+c.prediction.total.toFixed(2)+'/100':'Choose your expected or awarded grade'}</p></div><div class="grade-credits hub-note">${c.credits} credits${Object.hasOwn(DTU_POINTS,c.grade)?'<br>'+c.credits*DTU_POINTS[c.grade]+' weighted points':''}</div><div class="grade-select"><select aria-label="Expected grade for ${text(c.name)}" data-id="${text(c.id)}" data-testid="grade-select-${text(c.id)}" onchange="setCourseGrade(this.dataset.id,this.value)"><option value="">No grade</option>${Object.entries(DTU_POINTS).map(([g,p])=>`<option value="${g}" ${c.grade===g?'selected':''}>${g} · ${p}</option>`).join('')}<option value="I" ${c.grade==='I'?'selected':''}>I · Pending</option></select></div><button class="btn btn-sm" data-id="${text(c.id)}" data-testid="predict-marks-${text(c.id)}" onclick="editPrediction(this.dataset.id)">Predict from marks</button></div>`).join(''):emptyHub('Add subjects above, then enter grades or estimate from weighted marks.','fa-calculator')}</section>
    <section class="hub-section"><h3>Relative grading, not guessed percentages</h3><p class="hub-note">Final marks are the weighted sum of your assessment percentages. The class mean (μ) and standard deviation (σ) must be for those same final totals out of 100, not a single test. Grade thresholds follow Table 4 of the linked ordinance; caps are applied before assigning the highest qualifying grade. Scores below 35 remain F. Predictions assume attendance eligibility and the required end-term examination.</p><div class="grade-bands"><span>O ≥ min(μ + 1.5σ, 91)</span><span>A+ ≥ min(μ + σ, 82)</span><span>A ≥ min(μ + 0.5σ, 73)</span><span>B+ ≥ min(μ, 64)</span><span>B ≥ min(μ − 0.5σ, 55)</span><span>C ≥ min(μ − σ, 46)</span><span>P ≥ 35</span><span>F &lt; 35</span></div></section>`;
}
function setCourseGrade(id,grade){const c=semesterCourses().find(c=>c.id===id);c.grade=grade;delete c.prediction;save('academics');refreshHub();}
function predictDTUGrade(marks,mean,sd,appeared=true){
  if(!appeared||marks<35)return'F';
  const bands=[['O',1.5,91],['A+',1,82],['A',.5,73],['B+',0,64],['B',-.5,55],['C',-1,46]];
  return bands.find(([,factor,cap])=>marks+1e-9>=Math.min(mean+factor*sd,cap))?.[0]||'P';
}
function weightedDTUMarks(components){
  if(Math.abs(components.reduce((s,c)=>s+c.weight,0)-100)>.00001)throw new Error('Assessment weights must add up to exactly 100%.');
  let total=0;for(const c of components){if(c.weight===0)continue;if(!Number.isFinite(c.earned)||!Number.isFinite(c.max)||c.max<=0||c.earned<0||c.earned>c.max)throw new Error('For each active assessment, enter marks between 0 and its maximum.');total+=c.earned/c.max*c.weight;}return total;
}
function predictionFromForm(d){

  const total=weightedDTUMarks(components),mean=numberValue(d,'mark-mean',0,100),sd=numberValue(d,'mark-sd',0,50),appeared=d.get('mark-endterm')==='on';
  return{components,total,mean,sd,appeared,grade:predictDTUGrade(total,mean,sd,appeared)};
}

function prepLogsView(){
  const logs=[...prepData().logs].sort((a,b)=>b.date.localeCompare(a.date));
  return `<section class="hub-section"><h3>Small sessions, real progress.</h3><p class="hub-note">${upscTrack==='cse'?'Civil Services':'ESE Mechanical'} sessions only. Use dates and notes to remember what worked.</p>${logs.length?logs.map(l=>`<article class="hub-row" data-testid="study-log-${text(l.id)}"><div><div class="row-name">${text(l.topic)}</div><div class="row-meta">${text(l.date)}${l.note?' · '+text(l.note):''}</div></div><div class="row-number">${(l.minutes/60).toFixed(2)} h</div>${recordButtons(l.id,'editStudyLog','deleteStudyLog','study-log')}</article>`).join(''):emptyHub('No study sessions yet. Log a focused session to start.','fa-book-open')}</section>`;
}
function editStudyLog(id){
  const l=prepData().logs.find(l=>l.id===id)||{date:dateKey(),topicId:'',topic:'',minutes:'',note:''};
  const topics=prepTopics().map(t=>[t.id,t.name]);if(l.topicId&&!topics.some(([key])=>key===l.topicId))topics.push([l.topicId,l.topic+' (archived topic)']);
  editWorkspace(id?'Edit study session':'Log study · '+upscTrack.toUpperCase(),`${choose('study-topic','Topic',topics,l.topicId||topics[0][0])}<div class="field-row">${field('study-date','Date',l.date,'date',`max="${dateKey()}" required`)}${field('study-hours','Hours studied',l.minutes===''?'':l.minutes/60,'number','min="0.25" max="24" step="0.25" required')}</div>${field('study-note','Notes (optional)',l.note,'text','maxlength="200"')}`,d=>{
    const topicId=String(d.get('study-topic')),topic=topics.find(([id])=>id===topicId)[1],date=requiredText(d,'study-date');if(date>dateKey())throw new Error('Study logs cannot be in the future.');
    const row={id:id||crypto.randomUUID(),topicId,topic,date,minutes:Math.round(numberValue(d,'study-hours',.25,24)*60),note:String(d.get('study-note')).trim()};
    if(id)prepData().logs=prepData().logs.map(l=>l.id===id?row:l);else prepData().logs.push(row);save('upsc');
  });
}
function deleteStudyLog(id){confirmRemove('study session',()=>{prepData().logs=prepData().logs.filter(l=>l.id!==id);save('upsc');});}
function prepMocksView(){
  const mocks=[...prepData().mocks].sort((a,b)=>b.date.localeCompare(a.date));
  return `<section class="hub-section"><h3>Mocks are feedback, not a verdict.</h3><p class="hub-note">Enter your net score after negative marking. Percentages normalize different maximum marks; they are not percentiles or directly comparable across papers.</p>${mocks.length?`<div class="chart-box" style="height:220px"><canvas id="prepMockChart" data-testid="upsc-mock-chart" aria-label="Normalized mock scores over time"></canvas></div>${mocks.map(m=>`<article class="hub-row" data-testid="prep-mock-${text(m.id)}"><div><div class="row-name">${text(m.name)}</div><div class="row-meta">${text(m.date)} · ${text(m.paper)}${m.note?' · '+text(m.note):''}</div></div><div class="row-number">${m.score} / ${m.max}<div class="row-meta">${(m.score/m.max*100).toFixed(1)}%</div></div>${recordButtons(m.id,'editPrepMock','deletePrepMock','prep-mock')}</article>`).join('')}`:emptyHub('No mock scores yet. Add a test to establish your baseline.','fa-chart-line')}</section>`;
}
function postUpsc(){
  const mocks=[...prepData().mocks].sort((a,b)=>a.date.localeCompare(b.date));
  makeChart('prepMockChart',lineCfg(mocks.map(m=>m.date+' · '+m.paper),[{label:'Net marks (%)',data:mocks.map(m=>+(m.score/m.max*100).toFixed(2)),borderColor:'#34d399',backgroundColor:'rgba(52,211,153,.08)',fill:true,tension:.15,pointRadius:4}]));
}
function editPrepMock(id){
  const m=prepData().mocks.find(m=>m.id===id)||{name:'',paper:UPSC_PAPERS[upscTrack][0],date:dateKey(),score:'',max:200,note:''};
  editWorkspace(id?'Edit mock score':'Add mock · '+upscTrack.toUpperCase(),`${field('mock-name','Test name',m.name,'text','maxlength="100" required')}${choose('mock-paper','Paper',UPSC_PAPERS[upscTrack],m.paper)}<div class="field-row">${field('mock-score','Net score (negative allowed)',m.score,'number','min="-5000" max="5000" step="0.01" required')}${field('mock-max','Maximum marks',m.max,'number','min="1" max="5000" step="0.01" required')}</div>${field('mock-date','Date',m.date,'date',`max="${dateKey()}" required`)}${field('mock-note','What to improve (optional)',m.note,'text','maxlength="200"')}`,d=>{
    const score=numberValue(d,'mock-score',-5000,5000),max=numberValue(d,'mock-max',1,5000),date=requiredText(d,'mock-date');if(score>max||score< -max)throw new Error('Net score must be between minus the maximum and the maximum marks.');if(date>dateKey())throw new Error('Mock scores cannot be logged in the future.');
    const row={id:id||crypto.randomUUID(),name:requiredText(d,'mock-name'),paper:String(d.get('mock-paper')),date,score,max,note:String(d.get('mock-note')).trim()};
    if(id)prepData().mocks=prepData().mocks.map(m=>m.id===id?row:m);else prepData().mocks.push(row);save('upsc');
  });
}
function deletePrepMock(id){confirmRemove('mock score',()=>{prepData().mocks=prepData().mocks.filter(m=>m.id!==id);save('upsc');});}

/* ========== CLAUDE AI COACH ========== */
let coachBusy=false,coachPending=null,coachError='',coachDraft='';
let coachSessions=[],coachActive='',coachShare=false;
function loadCoachState(){
  const stored=lsGet('coachSessions',[]);
  coachSessions=(Array.isArray(stored)?stored:[]).filter(s=>s&&typeof s.id==='string'&&/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(s.id)&&typeof s.title==='string'&&Array.isArray(s.messages))
    .slice(0,10).map(s=>({id:s.id,title:s.title.slice(0,45),messages:s.messages.filter(m=>m&&['user','assistant'].includes(m.role)&&typeof m.content==='string').slice(-60)}));
  coachActive=lsGet('coachActive','');coachShare=lsGet('coachShare',false)===true;
  coachDraft='';coachError='';
}
loadCoachState();
function coachSave(){lsSet('coachSessions',coachSessions);lsSet('coachActive',coachActive);}
function coachSession(){
  let s=coachSessions.find(s=>s.id===coachActive);
  if(!s){s={id:crypto.randomUUID(),title:'New conversation',messages:[]};coachSessions.unshift(s);coachSessions=coachSessions.slice(0,10);coachActive=s.id;coachSave();}
  return s;
}
function coachBackend(){return lsGet('coachBackend','')||document.querySelector('meta[name="goatujju-backend"]').content;}
function coachSnapshot(){
  const w=weekSummary(),d=todayDaily();
  return{date:dateKey(),week_start:dateKey(w.mon),goat_score:computeGoat().score,
    today:{study:+d.study||0,problems:+d.problems||0,deficit:+d.deficit||0,cardio:+d.cardio||0,sleep:+d.sleep||0},
    week:{study:w.study,problems:w.problems,deficit:w.deficit,cardio:w.cardio,gym:w.gym},
    goals:Object.keys(DEF_TARGETS).map(k=>({name:S.targets[k].label,current:k==='weight'?latestWeight():+S.targets[k].current,target:+S.targets[k].target})),
    dsa_current:DSA_CHAPTERS[firstPendingDSA()]||'All completed',dsa_completed:S.dsa.completed.length};
}
function rCoach(){
  coachSession();
  return `${head('A little perspective.','Your goals. Your pace. A thinking partner for the next step.')}
    <div class="coach-toolbar">
      <span class="coach-model" data-testid="coach-model">CLAUDE SONNET 4.6</span>
      <button class="btn btn-sm" data-testid="coach-settings" onclick="coachSettings()" ${coachBusy?'disabled':''}><i class="fa-solid fa-sliders"></i> Connection</button>
      <select id="coachSessionSelect" data-testid="coach-session-select" aria-label="Saved conversations" ${coachBusy?'disabled':''}></select>
      <button class="btn btn-sm" data-testid="coach-new" onclick="coachNew()" ${coachBusy?'disabled':''}><i class="fa-solid fa-plus"></i> New chat</button>
    </div>
    <div class="coach-intro" data-testid="coach-intro">
      <h3>Turn the big mission into a doable day.</h3>
      <p>Plan your study blocks, untangle a DSA roadblock, or reflect on your week. Claude suggests; you stay in control of your trackers.</p>
      <div class="coach-prompts">
        <button class="btn" data-testid="coach-prompt-day" onclick="coachPrompt('day')" ${coachBusy?'disabled':''}><i class="fa-solid fa-sun"></i> Plan my day</button>
        <button class="btn" data-testid="coach-prompt-week" onclick="coachPrompt('week')" ${coachBusy?'disabled':''}><i class="fa-solid fa-calendar-week"></i> Review my week</button>
        <button class="btn" data-testid="coach-prompt-dsa" onclick="coachPrompt('dsa')" ${coachBusy?'disabled':''}><i class="fa-solid fa-code"></i> DSA next steps</button>
      </div>
    </div>
    <div class="coach-context">
      <label><input type="checkbox" id="coachShare" data-testid="coach-share" ${coachShare?'checked':''} ${coachBusy?'disabled':''}> Share a progress snapshot with this message</label>
      <p class="coach-privacy" data-testid="coach-sharing-note">Optional: goals, today's logs, this week's totals, GOAT score and DSA progress. Your journal is never included. Earlier replies may still refer to previously shared data.</p>
      <details><summary data-testid="coach-context-toggle">Preview the snapshot</summary><pre id="coachSnapshot" data-testid="coach-snapshot"></pre></details>
    </div>
    <div id="coachMessages" class="coach-messages" data-testid="coach-messages" role="log" aria-label="Conversation"></div>
    <div id="coachError" class="coach-error" data-testid="coach-error" role="alert" hidden></div>
    <form class="coach-compose" id="coachForm" data-testid="coach-form">
      <label class="field-label" for="coachInput">What's on your mind?</label>
      <textarea id="coachInput" data-testid="coach-input" maxlength="2000" placeholder="I have 3 hours today. Help me balance DSA and CAT prep." required ${coachBusy?'disabled':''}></textarea>
      <div class="coach-compose-foot">
        <span class="coach-status" id="coachStatus" data-testid="coach-status" role="status"></span>
        <button type="submit" class="btn btn-accent" id="coachSend" data-testid="coach-send" ${coachBusy?'disabled':''}><i class="fa-solid fa-arrow-up"></i> ${coachBusy?'Thinking…':'Send'}</button>
      </div>
    </form>
    <p class="coach-privacy" data-testid="coach-privacy">Messages go through your backend to Claude and use AI credits. Server conversation history expires after 30 days; the last 10 chats stay in this browser. Claude remembers the most recent 10 exchanges. AI can make mistakes; verify important advice.</p>`;
}
function postCoach(){
  const select=document.getElementById('coachSessionSelect');
  coachSessions.forEach(s=>{const o=document.createElement('option');o.value=s.id;o.textContent=s.title;o.selected=s.id===coachActive;select.appendChild(o);});
  select.onchange=()=>{coachActive=select.value;coachError='';coachDraft='';coachSave();render('coach');};
  const input=document.getElementById('coachInput');input.value=coachDraft;
  input.oninput=()=>{coachDraft=input.value;};
  input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();document.getElementById('coachForm').requestSubmit();}};
  document.getElementById('coachForm').onsubmit=e=>{e.preventDefault();coachSend();};
  document.getElementById('coachShare').onchange=e=>{coachShare=e.target.checked;lsSet('coachShare',coachShare);};
  document.getElementById('coachSnapshot').textContent=JSON.stringify(coachSnapshot(),null,2);
  coachPaint();
}
function coachPaint(){
  if(current!=='coach')return;
  const box=document.getElementById('coachMessages');if(!box)return;
  box.replaceChildren();
  const messages=[...coachSession().messages];
  if(coachPending&&coachPending.id===coachActive)messages.push({role:'user',content:coachPending.prompt},{role:'assistant',content:coachPending.text||'Thinking through your next step…'});
  messages.forEach((m,i)=>{
    const article=document.createElement('article');article.className='coach-message '+(m.role==='user'?'user':'assistant');article.dataset.testid='coach-message-'+i;
    const who=document.createElement('div');who.className='who';who.textContent=m.role==='user'?'YOU':'CLAUDE';
    const text=document.createElement('div');text.className='text';text.textContent=m.content;
    article.append(who,text);box.appendChild(article);
  });
  box.scrollTop=box.scrollHeight;
  const error=document.getElementById('coachError');error.hidden=!coachError;error.textContent=coachError;
  document.getElementById('coachStatus').textContent=coachBusy?'Claude is replying…':coachBackend()?'Enter to send · Shift + Enter for a new line':'Connect your backend to enable Claude';
}
function coachPrompt(kind){
  const prompts={day:'Help me make a realistic plan for today, balancing study, coding and recovery. Ask about my available time if you need it.',week:'Help me review my week: highlight wins, identify one gap, and suggest three achievable priorities for next week. Use my snapshot if shared; otherwise ask for my progress.',dsa:'Help me choose my next DSA practice steps. Use my current chapter if shared, otherwise ask where I am. Suggest a focused practice approach, not full solutions.'};
  coachDraft=prompts[kind];const input=document.getElementById('coachInput');input.value=coachDraft;input.focus();
}
function coachNew(){if(coachBusy)return;coachActive='';coachDraft='';coachError='';coachSession();render('coach');}
async function coachSend(){
  if(coachBusy)return;
  const input=document.getElementById('coachInput'),message=input.value.trim();if(!message)return;
  if(!coachBackend()){coachDraft=input.value;coachSettings();return;}
  const session=coachSession();coachDraft=message;coachError='';coachBusy=true;
  coachPending={id:session.id,prompt:message,text:''};
  const snapshot=coachShare?coachSnapshot():null;
  render('coach');
  const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),90000);
  let completed=false;
  try{
    const response=await fetch(coachBackend()+'/api/coach/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:session.id,message,snapshot}),signal:controller.signal});
    if(!response.ok){let err={};try{err=await response.json();}catch(e){}throw new Error(typeof err.detail==='string'?err.detail:'The coach could not accept this request. Check your connection and try again.');}
    const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='';
    while(true){
      const {done,value}=await reader.read();buffer+=decoder.decode(value,{stream:!done});
      let boundary;
      while((boundary=buffer.indexOf('\n\n'))!==-1){
        const frame=buffer.slice(0,boundary);buffer=buffer.slice(boundary+2);
        if(!frame.startsWith('data: '))continue;
        const ev=JSON.parse(frame.slice(6));
        if(ev.type==='delta'){coachPending.text+=ev.text;coachPaint();}
        if(ev.type==='error')throw new Error(ev.message);
        if(ev.type==='done'){completed=true;if(ev.truncated)coachPending.text+='\n\n[Reply length limit reached. Ask me to continue.]';}
      }
      if(done)break;
    }
    if(!completed)throw new Error('The reply was interrupted. Your message is ready to retry.');
    session.messages.push({role:'user',content:message},{role:'assistant',content:coachPending.text});session.messages=session.messages.slice(-60);
    if(session.title==='New conversation')session.title=message.slice(0,45);
    coachSave();coachDraft='';
  }catch(e){coachError=e.name==='AbortError'?'The request timed out. Please try again.':e instanceof TypeError?'Cannot reach your backend. Check Connection and its allowed website origins.':e.message;}
  finally{clearTimeout(timer);controller.abort();coachBusy=false;coachPending=null;if(current==='coach')render('coach');}
}
function coachSettings(){
  openModal(`<h3>Connect your AI backend</h3>
    <p class="muted" style="font-size:12px;line-height:1.7;margin-bottom:18px">The Claude key stays on your server, never in this page. For GitHub Pages, enter the HTTPS address of your separately hosted GOATUJJU backend. Only connect a server you trust: it receives your messages.</p>
    <label class="field-label" for="coachBackendInput">Backend URL (without /api)</label>
    <input type="url" id="coachBackendInput" data-testid="coach-backend-input" placeholder="Your hosted backend URL">
    <div id="coachConnectionStatus" data-testid="coach-connection-status" class="coach-privacy" role="status"></div>
    <div class="mfoot"><button class="btn" data-testid="coach-connection-cancel" onclick="closeModal()">Cancel</button><button class="btn btn-accent" id="coachConnect" data-testid="coach-connect" onclick="coachConnect()">Test & save</button></div>`);
  document.getElementById('coachBackendInput').value=coachBackend();
}
async function coachConnect(){
  const status=document.getElementById('coachConnectionStatus'),button=document.getElementById('coachConnect');
  button.disabled=true;status.textContent='Checking the connection…';
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),10000);
  try{
    const url=new URL(document.getElementById('coachBackendInput').value.trim());
    if(url.protocol!=='https:'||url.username||url.password||url.search||url.hash||!['','/'].includes(url.pathname))throw new Error('Enter an HTTPS backend origin only, without /api, a path or credentials.');
    const response=await fetch(url.origin+'/api/coach/health',{signal:controller.signal});
    if(!response.ok)throw new Error('Could not reach this GOATUJJU backend.');
    const data=await response.json();if(!data.available||data.model!=='claude-sonnet-4-6')throw new Error('This backend is not configured for Claude Sonnet 4.6.');
    lsSet('coachBackend',url.origin);status.textContent='Connected to Claude Sonnet 4.6. Your provider key stays server-side.';
    coachPaint();
  }catch(e){status.textContent=e.name==='AbortError'?'Connection timed out. Check your backend URL.':e instanceof TypeError?'Check the URL and add this website to backend CORS_ORIGINS.':e.message;}
  finally{clearTimeout(timer);button.disabled=false;}
}

/* ---------------- backup: export / import ---------------- */
function exportData(){
  const out={};
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf(NS)===0)out[k]=localStorage.getItem(k);}}catch(e){}
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='goatujju-backup-'+dateKey()+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importData(file){
  if(coachBusy){openModal('<h3>Reply in progress</h3><p class="muted" data-testid="import-busy">Wait for Claude to finish before importing a backup.</p><div class="mfoot"><button class="btn" data-testid="import-busy-close" onclick="closeModal()">OK</button></div>');return;}
  const r=new FileReader();
  r.onload=()=>{try{const obj=JSON.parse(r.result);let n=0;Object.keys(obj).forEach(k=>{if(k.indexOf(NS)===0){localStorage.setItem(k,obj[k]);n++;}});if(!n)throw 0;loadState();loadCoachState();route();openModal(`<h3>Backup restored</h3><p class="muted" style="font-size:13px">${n} data sets imported successfully. Everything's back.</p><div class="mfoot"><button class="btn btn-accent" onclick="closeModal()">Nice</button></div>`);}catch(e){openModal(`<h3>Import failed</h3><p class="muted" style="font-size:13px">That doesn't look like a valid GOATUJJU backup file.</p><div class="mfoot"><button class="btn btn-accent" onclick="closeModal()">OK</button></div>`);}};
  r.readAsText(file);
}

/* ---------------- boot ---------------- */
function boot(){
  migrate();loadState();recordGoat();buildNav();
  const day=trackerDay();
  document.getElementById('foot').textContent=day===0?'Tracker starts Oct 12':`Day ${day} of 70 \u00B7 relaunch Dec 20`;
  document.getElementById('exportBtn').addEventListener('click',exportData);
  document.getElementById('importBtn').addEventListener('click',()=>document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change',e=>{if(e.target.files[0]){importData(e.target.files[0]);e.target.value='';}});
  route();
}
if(document.readyState!=='loading')boot();else document.addEventListener('DOMContentLoaded',boot);
</script>
